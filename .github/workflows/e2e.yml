# End-to-end tests — drives the real app in a headless browser (Playwright).
# Hermetic: Playwright starts the Vite dev server and the specs stub all gateway
# calls, so no backend is needed. Separate from ci.yml so unit checks stay fast.
name: E2E

on:
  pull_request:
  push:
    # The PARITY branches (plus main) — where the visual baselines are enforced. See the `VISUAL`
    # env on the e2e job below.
    branches: [develop, qa, prod, main]
  workflow_dispatch: {}

jobs:
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # VISUAL gates the two pixel-baseline suites (e2e/support/visual.ts). They run only on a PUSH
      # to a parity branch — develop / qa / prod — because a committed baseline needs a human to
      # re-approve it on every intended redesign, and making that a per-PR gate turned every
      # legitimate UI change into push → fail → dispatch → download → commit → push. Feature PRs
      # still run the full functional, render and overflow matrices; those catch "this page is
      # broken". Visual catches "this page looks different", which is the question worth asking as a
      # change reaches a deployed environment.
      - name: Run E2E tests
        env:
          VISUAL: ${{ (github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'qa' || github.ref_name == 'prod')) && '1' || '0' }}
        run: npm run test:e2e

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # The HTML report embeds the trace, video and screenshot for each failure; test-results/
          # holds the raw files. Both, because the report is the readable one and the raw trace is
          # the one you can replay with `npx playwright show-trace`.
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Regenerate the committed visual baselines. Run manually (Actions → E2E → Run workflow)
  # after an INTENDED visual change, then download the artifact and commit it.
  #
  # It lives in CI rather than on a developer's machine because font rasterisation is
  # platform-specific: a baseline shot on macOS can never match this ubuntu runner, so the
  # only images worth committing are the ones this job produces. Uploaded as an artifact
  # rather than pushed, so a human still approves every pixel change — that approval IS the
  # test, and a job that force-pushed new baselines would quietly approve regressions.
  visual-baselines:
    name: Update visual baselines (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Regenerate baselines
        env:
          VISUAL: '1' # this job exists to shoot them, so it always opts in
        run: npx playwright test e2e/visual.spec.ts e2e/visual-states.spec.ts --update-snapshots

      - name: Upload the baselines to commit
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: |
            e2e/visual.spec.ts-snapshots/
            e2e/visual-states.spec.ts-snapshots/

  # LIVE lane — the same browser automation against a REAL core-engine (embedded H2).
  # Separate job because it needs a JVM and takes minutes, not seconds; the hermetic lane stays
  # the fast feedback loop. This is the only lane that can catch the app and the server
  # disagreeing about a request shape — a class of bug that is invisible to stubs and silent in
  # production. Needs core-engine checked out beside this repo.
  e2e-live:
    name: E2E live (real core-engine)
    runs-on: ubuntu-latest
    steps:
      - name: Get the UI
        uses: actions/checkout@v4
        with:
          path: luke-consumer-ui

      - name: Get core-engine
        uses: actions/checkout@v4
        with:
          repository: Luke-works/luke-core-engine
          ref: develop
          token: ${{ secrets.FLEET_REPO_TOKEN || github.token }}
          path: luke-core-engine

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: luke-consumer-ui/package-lock.json

      - name: Install dependencies
        working-directory: luke-consumer-ui
        run: npm ci

      - name: Install Playwright browser
        working-directory: luke-consumer-ui
        run: npx playwright install --with-deps chromium

      - name: Run the live E2E lane
        working-directory: luke-consumer-ui
        # Playwright boots core-engine, the gateway stand-in and the dev server itself.
        run: npm run test:e2e:live

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-live-report
          path: |
            luke-consumer-ui/playwright-report/
            luke-consumer-ui/test-results/
          retention-days: 14
