# CI — the "robot" that checks every change before it counts.
# Runs automatically on every Pull Request and every push to develop.
# Green check = safe to merge. Red X = something's broken (it tells you what).
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch: {}

jobs:
  build-and-test:
    name: Build & test (Node 22 / Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm          # reuse downloaded packages between runs (faster)

      - name: Install dependencies
        run: npm ci

      - name: Check vendored @lukeflow/form-* tree
        # The form packages are built in the luke-forms repo and COPIED in here. This proves the
        # copy is exactly what the last vendor run produced — catching hand-edits, partial copies,
        # and a stale package whose upstream fix never made it across.
        run: npm run vendor:check

      - name: Type-check & build
        # 'npm run build' = tsc (type-check) + vite build. Catches type errors and
        # broken imports before they ship.
        run: npm run build

      - name: Public bundles match the lock
        # /embed and /respond are built HERE but SERVED by luke-core-engine, and copied across
        # by hand (scripts/vendor-bundle.mjs). Nothing verified that copy, so both bundles
        # silently rotted five days behind their source — the third-party embed was serving a
        # form with none of the layout fixes. This fails the moment the built output changes,
        # which is exactly when a re-vendor becomes necessary. Free: `npm run build` above
        # already produced both bundles, so this only hashes them.
        run: npm run bundles:check

      - name: Unit tests
        # Runs the vitest suite once (skips automatically if there's no test script).
        run: npm test --if-present

      - name: Lint
        # Gating, zero-tolerance: `npm run lint` is `eslint . --max-warnings 0`, so any
        # error OR warning fails the build.
        run: npm run lint --if-present

      - name: Accessibility lint (informational)
        # D14: eslint-plugin-jsx-a11y over the app. NON-gating for now — there's an existing
        # baseline of ~38 findings (a mix of live MVP pages and post-MVP Phone/Signatures/Workflow
        # surfaces, some UX-opinionated). Surfaced here so a11y regressions are visible in CI; fold
        # `eslint.config.a11y.js`'s rules into the gating `lint` once the baseline is cleared.
        run: npm run lint:a11y --if-present
        continue-on-error: true
